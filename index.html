<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deepweights — AI Products</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- Ant Design reset + component styles -->
  <link rel="stylesheet" href="https://unpkg.com/antd@5.29.3/dist/reset.css" />

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Ant Design peer dep -->
  <script src="https://unpkg.com/dayjs@1.11.23/dayjs.min.js"></script>
  <!-- Ant Design -->
  <script src="https://unpkg.com/antd@5.29.3/dist/antd.min.js"></script>
  <script src="https://unpkg.com/@ant-design/icons@6.3.2/dist/index.umd.js"></script>
  <!-- In-browser JSX transform -->
  <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

  <style>
    :root {
      --brand: #1677ff;
      --brand-soft: #e6f4ff;
      --dark: #001529;
      --border: #f0f0f0;
      --text-secondary: rgba(0, 0, 0, 0.65);
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: rgba(0, 0, 0, 0.88);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    #root { min-height: 100vh; }

    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 64px;
      display: flex;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .site-header .brand-logo { height: 24px; display: block; }
    .site-header .ant-menu {
      border-bottom: none !important;
      background: transparent;
      line-height: 62px;
      font-size: 14px;
    }
    .site-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-nav-wrap { flex: 1; display: flex; justify-content: flex-end; }
    .mobile-menu-btn { display: none; font-size: 18px; }

    .flat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      height: 100%;
    }
    .flat-card:hover {
      border-color: var(--brand);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    .tile-card {
      border-radius: 16px;
      padding: 32px;
      height: 100%;
      border: 1px solid rgba(5, 5, 5, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .tile-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .doc-tag-link { text-decoration: none; }
    .doc-tag-link .ant-tag {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.7);
    }

    .section-eyebrow {
      color: var(--brand);
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    section { padding: 88px 24px; }
    .section-inner { max-width: 1200px; margin: 0 auto; }

    /* ── Footer (ant.design dark footer) ───────────── */
    .site-footer {
      background: var(--dark);
      color: rgba(255, 255, 255, 0.65);
      padding: 64px 24px 24px;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    .footer-col-title {
      color: rgba(255, 255, 255, 0.95);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .footer-link {
      display: block;
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      margin-bottom: 12px;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-link:hover { color: #fff; }
    .footer-bottom {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 768px) {
      .header-nav-wrap { display: none; }
      .mobile-menu-btn { display: inline-flex; align-items: center; justify-content: center; }
      section { padding: 56px 20px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel-jsx" id="app-src">
    const { ConfigProvider, Menu, Button, Typography, Row, Col, Card, Tag, Space, Drawer } = antd;
    const { Title, Paragraph, Text } = Typography;
    const {
      SafetyCertificateOutlined,
      ApiOutlined,
      IdcardOutlined,
      BankOutlined,
      MenuOutlined,
    } = icons;
    const { useState } = React;

    const CONTACT_MAILTO =
      "mailto:anbarasan@deepweights.com?subject=Hello%20Deepweights&body=Hi%2C%0A%0AI%27d%20like%20to%20learn%20more%20about%20Deepweights%20and%20your%20products.%0A%0AUse%20case%3A%0A%0AThanks.";

    function UpcomingLabel({ children }) {
      return (
        <a href="kie.html" className="doc-tag-link">
          {children}{" "}
          <Tag color="gold" style={{ marginLeft: 4 }}>Upcoming</Tag>
        </a>
      );
    }

    function DocLabel({ children }) {
      return <a href="kie.html" style={{ color: "inherit" }}>{children}</a>;
    }

    const navItems = [
      {
        key: "products",
        label: "Products",
        children: [
          {
            key: "kie",
            label: "Key Information Extraction (KIE)",
            children: [
              {
                key: "india",
                label: "India",
                children: [
                  {
                    key: "india-identity",
                    label: "Identity documents",
                    children: [
                      { key: "pan", label: <DocLabel>PAN</DocLabel> },
                      { key: "aadhaar", label: <DocLabel>AADHAR</DocLabel> },
                      { key: "passport", label: <DocLabel>Passport</DocLabel> },
                      { key: "dl", label: <UpcomingLabel>Driving Licence</UpcomingLabel> },
                      { key: "voterid", label: <UpcomingLabel>VoterId</UpcomingLabel> },
                    ],
                  },
                  {
                    key: "india-bank",
                    label: "Bank documents",
                    children: [
                      { key: "cheque", label: <DocLabel>Cheque</DocLabel> },
                    ],
                  },
                ],
              },
              {
                key: "singapore",
                label: "Singapore",
                children: [
                  {
                    key: "sg-identity",
                    label: "Identity documents",
                    children: [
                      { key: "idcard", label: <DocLabel>ID Card</DocLabel> },
                    ],
                  },
                ],
              },
            ],
          },
        ],
      },
      { key: "about", label: <a href="#about">About</a> },
    ];

    function Header() {
      const [drawerOpen, setDrawerOpen] = useState(false);
      return (
        <header className="site-header">
          <div className="site-header-inner">
            <a href="index.html" style={{ display: "flex", alignItems: "center" }}>
              <img
                src="assets/fulllogo_transparent_nobuffer.png"
                alt="Deepweights"
                className="brand-logo"
              />
            </a>
            <div className="header-nav-wrap">
              <Menu mode="horizontal" items={navItems} selectable={false} triggerSubMenuAction="hover" />
            </div>
            <Button
              className="mobile-menu-btn"
              type="text"
              icon={<MenuOutlined />}
              onClick={() => setDrawerOpen(true)}
            />
          </div>
          <Drawer
            title={
              <img src="assets/fulllogo_transparent_nobuffer.png" alt="Deepweights" style={{ height: 20 }} />
            }
            placement="right"
            width={300}
            onClose={() => setDrawerOpen(false)}
            open={drawerOpen}
            styles={{ body: { padding: 0 } }}
          >
            <Menu
              mode="inline"
              items={navItems}
              selectable={false}
              onClick={() => setDrawerOpen(false)}
            />
          </Drawer>
        </header>
      );
    }

    function FeatureCard({ icon, title, description }) {
      return (
        <Card className="flat-card" styles={{ body: { padding: 28 } }}>
          <div
            style={{
              width: 40, height: 40, borderRadius: 8, background: "var(--brand-soft)",
              display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16,
            }}
          >
            {icon}
          </div>
          <Title level={5} style={{ marginBottom: 8 }}>{title}</Title>
          <Paragraph style={{ color: "var(--text-secondary)", marginBottom: 0 }}>{description}</Paragraph>
        </Card>
      );
    }

    function About() {
      return (
        <section id="about" style={{ background: "#fafafa" }}>
          <div className="section-inner">
            <div style={{ maxWidth: 640, marginBottom: 40 }}>
              <span className="section-eyebrow">About</span>
              <Title level={2} style={{ marginTop: 8, marginBottom: 14 }}>Built for the real world</Title>
              <Paragraph style={{ color: "var(--text-secondary)", fontSize: 16, lineHeight: 1.75, marginBottom: 0 }}>
                Privacy-first by design. Every product we ship is built with zero data retention as a default — what goes in doesn't stay.
              </Paragraph>
            </div>
            <Row gutter={[24, 24]}>
              <Col xs={24} sm={12}>
                <FeatureCard
                  icon={<ApiOutlined style={{ color: "var(--brand)", fontSize: 18 }} />}
                  title="Production-ready APIs"
                  description="REST APIs designed to integrate in minutes, not weeks."
                />
              </Col>
              <Col xs={24} sm={12}>
                <FeatureCard
                  icon={<SafetyCertificateOutlined style={{ color: "var(--brand)", fontSize: 18 }} />}
                  title="Zero data retention"
                  description="What goes in doesn't stay — nothing is logged or stored by default."
                />
              </Col>
            </Row>
          </div>
        </section>
      );
    }

    function ProductTile({ background, icon, flag, title, subtitle, children }) {
      return (
        <div className="tile-card" style={{ background }}>
          <Space align="center" style={{ marginBottom: 14 }}>
            <div
              style={{
                width: 44, height: 44, borderRadius: 10, background: "#fff",
                display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,
              }}
            >
              {icon}
            </div>
            <span style={{ fontSize: 20 }}>{flag}</span>
          </Space>
          <Title level={4} style={{ marginBottom: 2 }}>{title}</Title>
          <Text type="secondary">{subtitle}</Text>
          <div style={{ marginTop: 20 }}>
            <Space size={[8, 8]} wrap>
              {children}
            </Space>
          </div>
        </div>
      );
    }

    function Products() {
      return (
        <section id="products" style={{ background: "#fff", paddingTop: 128 }}>
          <div className="section-inner">
            <span className="section-eyebrow">Products</span>
            <Title level={2} style={{ marginTop: 8, marginBottom: 40 }}>Key Information Extraction (KIE)</Title>

            <Row gutter={[24, 24]}>
              <Col xs={24} md={8}>
                <ProductTile
                  background="#e6f4ff"
                  icon={<IdcardOutlined style={{ color: "var(--brand)" }} />}
                  flag="🇮🇳"
                  title="India — Identity documents"
                  subtitle="Extract structured fields from government-issued IDs."
                >
                  <a className="doc-tag-link" href="kie.html"><Tag color="blue">PAN</Tag></a>
                  <a className="doc-tag-link" href="kie.html"><Tag color="blue">AADHAR</Tag></a>
                  <a className="doc-tag-link" href="kie.html"><Tag color="gold">Passport · Upcoming</Tag></a>
                  <a className="doc-tag-link" href="kie.html"><Tag color="gold">Driving Licence · Upcoming</Tag></a>
                  <a className="doc-tag-link" href="kie.html"><Tag color="gold">VoterId · Upcoming</Tag></a>
                </ProductTile>
              </Col>

              <Col xs={24} md={8}>
                <ProductTile
                  background="#f9f0ff"
                  icon={<BankOutlined style={{ color: "#722ed1" }} />}
                  flag="🇮🇳"
                  title="India — Bank documents"
                  subtitle="Parse and validate financial instruments."
                >
                  <a className="doc-tag-link" href="kie.html"><Tag color="gold">Cheque · Upcoming</Tag></a>
                </ProductTile>
              </Col>

              <Col xs={24} md={8}>
                <ProductTile
                  background="#e6fffb"
                  icon={<IdcardOutlined style={{ color: "#13a8a8" }} />}
                  flag="🇸🇬"
                  title="Singapore — Identity documents"
                  subtitle="Extract structured fields from national ID cards."
                >
                  <a className="doc-tag-link" href="kie.html"><Tag color="cyan">ID Card</Tag></a>
                </ProductTile>
              </Col>
            </Row>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="site-footer">
          <div className="footer-inner">
            <Row gutter={[32, 32]}>
              <Col xs={24} sm={8}>
                <img src="assets/fulllogo_transparent_nobuffer.png" alt="Deepweights" style={{ height: 22, marginBottom: 12, filter: "brightness(0) invert(1)" }} />
                <Paragraph style={{ color: "rgba(255,255,255,0.45)", fontSize: 13, maxWidth: 260 }}>
                  Applied AI products for document understanding and structured extraction.
                </Paragraph>
              </Col>
              <Col xs={12} sm={8}>
                <div className="footer-col-title">Products</div>
                <a className="footer-link" href="#products">Key Information Extraction</a>
                <a className="footer-link" href="kie.html">KIE — India</a>
                <a className="footer-link" href="kie.html">KIE — Singapore</a>
              </Col>
              <Col xs={12} sm={8}>
                <div className="footer-col-title">Company</div>
                <a className="footer-link" href="#about">About</a>
                <a className="footer-link" href={CONTACT_MAILTO}>Contact</a>
              </Col>
            </Row>
            <div className="footer-bottom">
              <span>© 2026 Deepweights. All rights reserved.</span>
              <span>Built for the real world.</span>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      return (
        <ConfigProvider
          theme={{
            token: {
              colorPrimary: "#1677ff",
              borderRadius: 6,
              fontFamily:
                '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif',
            },
          }}
        >
          <Header />
          <Products />
          <About />
          <Footer />
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    (function () {
      var src = document.getElementById("app-src").textContent;
      var out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      var s = document.createElement("script");
      s.text = out;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
